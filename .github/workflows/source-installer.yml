name: Source installer
on:
  push:
    paths:
      - 'tools/installer/**'
      - 'tools/dev*'
      - 'cmd/nanolathe/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/source-installer.yml'
  pull_request:
    paths:
      - 'tools/installer/**'
      - 'tools/dev*'
      - 'cmd/nanolathe/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/source-installer.yml'
  workflow_dispatch:
    inputs:
      manifest_url:
        description: 'Optional HTTPS release manifest for a full clean Unix source install without game assets'
        required: false
        default: ''
      releases_api:
        description: 'Optional GitHub API root whose releases the clean Windows install uses (https://api.github.com/repos/OWNER/nanolathe); default this repository'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
      MANIFEST_URL: ${{ inputs.manifest_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Native development launcher contracts
        run: python tools/dev_test.py
      - name: Build desktop command with Go alone
        run: go build -o nanolathe-installer-check.exe ./cmd/nanolathe
      - name: Startup and save-directory contracts
        run: go test ./cmd/nanolathe -run 'Installer|SaveDirectory'
      - name: Unix installer failure and launch contracts
        if: runner.os != 'Windows'
        run: python3 tools/installer/test_install.py
      - name: Windows installer failure and launch contracts
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tools/installer/test-install.ps1
      - name: Clean Unix source install
        if: runner.os != 'Windows' && inputs.manifest_url != ''
        shell: bash
        run: |
          export NANOLATHE_INSTALL_DIR="$RUNNER_TEMP/Nanolathe Install Test"
          python3 - <<'PY'
          import os
          from pathlib import Path
          from urllib.parse import urlsplit
          url = os.environ['MANIFEST_URL']
          if urlsplit(url).scheme != 'https':
              raise SystemExit('Manifest must use HTTPS')
          script = Path('tools/installer/install.sh').read_text()
          Path(os.environ['RUNNER_TEMP'], 'install-test.sh').write_text(script.replace('https://nanolathe.gg/install/release.txt', url))
          PY
          bash "$RUNNER_TEMP/install-test.sh" --no-run
          "$NANOLATHE_INSTALL_DIR/current/nanolathe" --help
      # The Windows script installs the launcher from the published releases,
      # which installs the game (tools/installer/README.md "Windows launcher").
      # No game assets are needed, so no game is started.
      - name: Clean Windows install from the published releases
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch'
        shell: powershell
        env:
          NANOLATHE_RELEASES_API: ${{ inputs.releases_api }}
        run: |
          $env:NANOLATHE_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'Nanolathe Install Test'
          $script = [IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE 'tools/installer/install.ps1'))
          & ([scriptblock]::Create($script)) -NoRun
          $release = [IO.File]::ReadAllText((Join-Path $env:NANOLATHE_INSTALL_DIR 'current.txt')).Trim()
          $installedExe = Join-Path (Join-Path (Join-Path $env:NANOLATHE_INSTALL_DIR 'releases') $release) 'nanolathe.exe'
          cmd /c "`"$installedExe`" --help >nul 2>&1"
          if ($LASTEXITCODE -ne 0) { throw "The installed game did not start (exit code $LASTEXITCODE)." }
          $buildInfo = (& go version -m $installedExe) -join "`n"
          . ./tools/installer/install.ps1
          $expectedArch = Resolve-NanolatheWindowsArchitecture @(Get-CimInstance Win32_Processor | Select-Object -ExpandProperty Architecture) $true
          if ($buildInfo -notmatch "GOARCH=$expectedArch") { throw 'Installed executable does not match the native CPU.' }
          $launcher = Join-Path $env:NANOLATHE_INSTALL_DIR 'nanolathe-launcher.exe'
          if (![IO.File]::Exists($launcher)) { throw 'The launcher is not installed.' }
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'Nanolathe.lnk'
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcut).TargetPath
          if ($target -ne $launcher) { throw "The Start Menu shortcut starts $target, not the launcher." }
          Write-Host "Installed $release for native Windows $expectedArch, with the launcher and its Start Menu shortcut."
          exit 0
      - name: Upload installer diagnostics
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: installer-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/Nanolathe Install Test/logs
          if-no-files-found: ignore
