name: ci
on:
  push:
  pull_request:

env:
  # Retail-asset-dependent tests are opt-in via NANOLATHE_TA_ROOT or
  # NANOLATHE_RETAIL_ASSETS and skip with a clear message when absent.
  # CI must NOT require retail assets.
  CI: "true"

jobs:
  # This gate has no X server and installs no desktop graphics/audio headers.
  # Importing the runner or tiny command must remain platform-device-free.
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build displayless command
        run: go build ./cmd/nanolathe-headless
      - name: advance synthetic authoritative session
        run: go test ./internal/headless ./cmd/nanolathe-headless

  # Execute the kernel vectors on each supported platform; cross-compilation
  # alone cannot detect differences in floating-point results.
  numeric-kernel:
    name: numeric kernel (${{ matrix.goos }}/${{ matrix.goarch }}, ${{ matrix.goamd64 || 'native' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            goamd64: v1
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            goamd64: v3
          - runner: macos-15
            goos: darwin
            goarch: arm64
            goamd64: ""
          - runner: windows-2025
            goos: windows
            goarch: amd64
            goamd64: v1
    runs-on: ${{ matrix.runner }}
    env:
      GOMAXPROCS: "4"
      GOFLAGS: -trimpath -p=4
      GOAMD64: ${{ matrix.goamd64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: verify native Go platform
        shell: bash
        env:
          EXPECTED_PLATFORM: ${{ matrix.goos }}/${{ matrix.goarch }}
          EXPECTED_GOAMD64: ${{ matrix.goamd64 }}
        run: |
          target="$(go env GOOS)/$(go env GOARCH)"
          host="$(go env GOHOSTOS)/$(go env GOHOSTARCH)"
          level="$(go env GOAMD64)"
          echo "Go host=$host target=$target GOAMD64=$level expected=$EXPECTED_PLATFORM/$EXPECTED_GOAMD64"
          test "$host" = "$EXPECTED_PLATFORM"
          test "$target" = "$EXPECTED_PLATFORM"
          test "$level" = "$EXPECTED_GOAMD64"
      - name: execute numeric kernel tests and vectors
        shell: bash
        run: go test -count=1 ./internal/sim/numeric
      - name: execute authored complete-checkpoint script
        shell: bash
        run: go test -json -count=1 -run '^TestCheckpointPortableScript$' ./internal/session > checkpoints.json
      - name: keep native checkpoint evidence
        uses: actions/upload-artifact@v4
        with:
          name: checkpoints-${{ matrix.goos }}-${{ matrix.goarch }}-${{ matrix.goamd64 || 'native' }}
          path: checkpoints.json
          retention-days: 14
          if-no-files-found: error

  checkpoint-equivalence:
    name: compare native complete checkpoints
    needs: numeric-kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: checkpoints-*
          path: checkpoint-evidence
      - name: compare every recorded identity and owner digest
        run: python3 .github/scripts/compare-checkpoints.py checkpoint-evidence

  # Formatting and static checks. Cheap, so it gates the rest.
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: install native graphics/audio headers
        run: .github/scripts/install-linux-deps.sh
      - name: gofmt
        run: |
          # Only tracked files: a nested worktree or a vendored drop would
          # otherwise be reported and is not ours to format.
          unformatted=$(gofmt -l $(git ls-files '*.go') | grep -v '^content/' || true)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
      - name: git diff --check
        run: git diff --check
      - name: go vet (all packages)
        run: go vet ./...

  # The simulation is headless and must never need a display device. This job
  # is the one that proves it: no X server is started for it.
  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: install native graphics/audio headers
        run: .github/scripts/install-linux-deps.sh
      - name: go build (all packages)
        run: go build ./...
      - name: go test (all packages)
        run: go test ./...

  # Determinism and cross-session isolation. Slower, so it is scoped to the
  # packages that own mutable simulation state.
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: install native graphics/audio headers
        run: .github/scripts/install-linux-deps.sh
      - name: go test -race (simulation packages)
        run: |
          go test -race \
            ./internal/session/... \
            ./internal/orders/... \
            ./internal/movement/... \
            ./internal/construction/... \
            ./internal/combat/...
      # The relay, its clients and the online host run the most goroutines:
      # per-peer writers, the client's writer and grant reader, recorders.
      - name: go test -race (multiplayer packages)
        run: |
          go test -race \
            ./internal/netproto/... \
            ./internal/relay/... \
            ./internal/lockstep/... \
            ./internal/replay/... \
            ./cmd/nanolathe-server/... \
            ./cmd/nanolathe-relay-check/...
          go test -race -run 'Online|Hosted|Relay|Lobby|Multiplayer' ./cmd/nanolathe

  # The artifact users actually run.
  binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: install native graphics/audio headers
        run: .github/scripts/install-linux-deps.sh
      - name: build production binary
        run: go build -o /tmp/nanolathe ./cmd/nanolathe
      - name: binary runs
        run: /tmp/nanolathe --help

  # Browser host contracts and the actual asset-free Wasm artifact.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: browser host regressions
        run: tools/browser-check
      - name: execute Wasm numeric kernel vectors
        env:
          GOOS: js
          GOARCH: wasm
          GOMAXPROCS: '1'
        run: go test -exec "$(go env GOROOT)/lib/wasm/go_js_wasm_exec" ./internal/sim/numeric
      - name: play a hosted match from the Wasm relay client
        env:
          NANOLATHE_WASM_RELAY: '1'
        run: go test -count=1 -run '^TestWasmClientPlaysHostedMatch$' -v ./internal/relay
      - name: build asset-free browser distribution
        run: tools/browser-build
      - name: keep the browser distribution
        uses: actions/upload-artifact@v4
        with:
          name: browser-build
          path: build/browser
          retention-days: 14
          if-no-files-found: error

  # Exercise the deployed relay with this build's schema, without game assets
  # or graphics. Both pushes and pull requests must expose admission drift.
  public-relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: verify public relay compatibility
        run: go run ./cmd/nanolathe-relay-check
      - name: verify the local main-push guard
        run: python3 tools/check_relay_test.py

  # Main's asset-free browser build becomes this run's immutable "browser-<n>"
  # prerelease, which the website pulls in (docs/DESIGN_BROWSER_HOST.md §6);
  # tools/browser-publish keeps this run's release and the one before it. No
  # demo or retail content enters this repository's releases.
  browser-publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [browser, hygiene, simulation, public-relay]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: browser-publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: browser-build
          path: build/browser
      - name: package the distribution
        run: |
          set -eu
          test -f build/browser/build.json
          tar -C build/browser -czf nanolathe-browser.tar.gz .
          cp build/browser/build.json build.json
          sha256sum nanolathe-browser.tar.gz build.json > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: recheck public relay immediately before publication
        run: go run ./cmd/nanolathe-relay-check
      - name: publish this run's browser release
        id: publish
        run: tools/browser-publish --revision "$GITHUB_SHA" --run-number "$GITHUB_RUN_NUMBER" nanolathe-browser.tar.gz build.json SHA256SUMS
      - name: ask the website to pull the build
        env:
          WEBSITE_DISPATCH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          set -eu
          if [ -z "$WEBSITE_DISPATCH_TOKEN" ]; then
            echo "WEBSITE_DISPATCH_TOKEN is not configured; the website refreshes on its own schedule."
            exit 0
          fi
          GH_TOKEN="$WEBSITE_DISPATCH_TOKEN" gh api repos/nanolathe-gg/nanolathe-gg.github.io/dispatches \
            -f event_type=browser-build -f "client_payload[revision]=${GITHUB_SHA}" \
            -f "client_payload[tag]=${{ steps.publish.outputs.tag }}"

  # The prebuilt native executables, built and stamped exactly as the source
  # installers build theirs, so they play online with installer builds
  # (tools/native_build.py). The unsigned Windows executables are also kept
  # on their own, in the layout code signing takes.
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: native build contracts
        run: python3 -m unittest discover -s tools -p 'native_*_test.py'
      - name: build stamped executables for every target
        run: tools/native-build --revision "$GITHUB_SHA" --run-number "$GITHUB_RUN_NUMBER" --out build/native
      - name: package the release assets
        run: tools/native-package --build build/native --out build/native-dist
      - name: keep the unsigned Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-unsigned
          path: |
            build/native/windows-amd64/nanolathe.exe
            build/native/windows-arm64/nanolathe.exe
          retention-days: 14
          if-no-files-found: error
      - name: keep the release assets
        uses: actions/upload-artifact@v4
        with:
          name: native-dist
          path: build/native-dist
          retention-days: 14
          if-no-files-found: error

  # Each packaged executable starts on its own platform, verifies against
  # SHA256SUMS, and reports the stamp and revision build.json records. The
  # Windows executables also carry the version resource signing requires.
  native-smoke:
    name: native smoke (${{ matrix.target }})
    needs: native
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: windows-amd64
          - runner: windows-11-arm
            target: windows-arm64
          - runner: ubuntu-latest
            target: linux-amd64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: native-dist
          path: dist
      - name: packaged Windows executable runs and reports its build
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          foreach ($line in Get-Content dist/SHA256SUMS) {
              $hash, $name = $line -split '  ', 2
              if ((Get-FileHash -LiteralPath "dist/$name" -Algorithm SHA256).Hash -ne $hash) { throw "SHA256SUMS mismatch: $name" }
          }
          $build = Get-Content dist/build.json -Raw | ConvertFrom-Json
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::ExtractToDirectory((Resolve-Path "dist/nanolathe-$env:TARGET.zip"), "$PWD\game")
          New-Item -ItemType Directory empty | Out-Null
          $exe = "$PWD\game\nanolathe.exe"
          # Startup diagnostics go to standard error before an empty folder fails the check.
          $report = cmd /c "`"$exe`" --check-install --root `"$PWD\empty`" 2>&1"
          $report | Select-Object -First 6 | Write-Host
          if (-not ($report -cmatch "^nanolathe: build manifest: $($build.build_manifest)$")) { throw 'The executable does not report the stamped build manifest.' }
          if (-not ($report -cmatch "revision=$($build.revision) \(installed source\)")) { throw 'The executable does not report its source revision.' }
          $info = (Get-Item -LiteralPath $exe).VersionInfo
          if ($info.ProductName -cne 'Nanolathe' -or $info.FileVersion -cne $build.version -or $info.ProductVersion -cne $build.version) {
              throw "Version resource names $($info.ProductName) $($info.FileVersion), expected Nanolathe $($build.version)."
          }
          Write-Host "$env:TARGET reports build manifest $($build.build_manifest) and carries version $($info.FileVersion)."
          exit 0
      - name: packaged Linux executable runs and reports its build
        if: runner.os == 'Linux'
        run: |
          set -eu
          (cd dist && sha256sum -c SHA256SUMS)
          manifest=$(sed -n 's/.*"build_manifest": "\([0-9a-f]*\)".*/\1/p' dist/build.json)
          revision=$(sed -n 's/.*"revision": "\([0-9a-f]*\)".*/\1/p' dist/build.json)
          mkdir game empty
          tar -xzf "dist/nanolathe-$TARGET.tar.gz" -C game
          # Startup diagnostics go to standard error before an empty folder fails the check.
          report=$(game/nanolathe --check-install --root "$PWD/empty" 2>&1 || true)
          echo "$report" | head -6
          grep -qx "nanolathe: build manifest: $manifest" <<<"$report"
          grep -qF "revision=$revision (installed source)" <<<"$report"
          echo "$TARGET reports build manifest $manifest."

  # Main's native executables become this run's immutable "native-<n>"
  # prerelease, the launcher's Latest channel; tools/native-publish keeps this
  # run's release and the one before it. They are unsigned: only Stable
  # releases are signed, since each signature is approved by hand.
  native-publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [native, native-smoke, hygiene, simulation, public-relay]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: native-publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-dist
          path: dist
      - name: publish this run's native release
        run: tools/native-publish --revision "$GITHUB_SHA" --run-number "$GITHUB_RUN_NUMBER" dist/*
